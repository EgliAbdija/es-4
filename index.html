<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>



    <div class="text-center bg-warning">
        <h1>SCRIPT JAVA</h1>
        <p>Una collezione di script Javascript</p>
    </div>

    <div class="container">
        <div class="row text-center">
            <div class="text-primary col-4 border border-warning">
                <h2>COSA FA LO SCRIPT</h2>
                <img src="./images/278d0bbf-6aaf-4f38-a18f-e328305bcd7b.png" alt="" class="java">
                <p>Inserisci un numero e lo script calcolerà i divisiori</p>
            </div>
            <div class="text-primary border border-warning col-4 text-center">
                <h2>IL TUO INPUT</h2>
                <input type="number" id="num" placeholder="inserisci il numero" class="col-auto textbox">
                <button type="button" class="btn btn-outline-secondary col-auto" onclick="Calcola()">Calcola</button>
            </div>
            <div class="text-primary col-4 border border-warning">
                <h2>IL TUO RISULTATO</h2>
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
